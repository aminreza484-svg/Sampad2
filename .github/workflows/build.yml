            to{opacity:1;transform:translateY(0)}
          }
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
          .card h2{font-size:1rem;margin:0 0 10px}
          label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
          select,input[type=text],textarea{
            width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
            background:var(--bg);color:var(--ink);font-family:inherit;font-size:.92rem;margin-bottom:10px
          }
          textarea{resize:vertical;min-height:60px}
          button{
            border:none;border-radius:9px;padding:10px 16px;font-size:.9rem;font-weight:600;
            cursor:pointer;font-family:inherit;
            transition:transform .08s ease, filter .08s ease, box-shadow .08s ease;
            -webkit-tap-highlight-color:transparent;
          }
          button:active{transform:scale(.94);filter:brightness(.85)}
          .btn-primary{background:var(--accent);color:#06130d;width:100%;box-shadow:0 2px 0 rgba(0,0,0,.25)}
          .btn-primary:active{box-shadow:0 0 0 rgba(0,0,0,.25);transform:translateY(1px) scale(.97)}
          .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;font-size:.8rem}
          .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:5px 10px;font-size:.75rem}
          .day-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
          .day-row .name{width:78px;flex-shrink:0;font-size:.85rem;color:var(--muted)}
          .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
          .chip{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:.78rem;display:flex;align-items:center;gap:6px}
          .chip span{cursor:pointer;font-weight:700}
          .date-row{display:flex;gap:6px}
          .date-row input{flex:1;min-width:0;text-align:center;margin-bottom:10px}
          .day-input{display:flex;gap:6px;flex-wrap:wrap}
          .day-input input{margin:0;flex:1;min-width:90px}
          .day-input select{margin:0;flex:0 0 100%}
          .day-input button{white-space:nowrap;padding:9px 12px}
          .day-block{margin-bottom:16px}
          .day-title{font-weight:700;font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
          .day-title .today-badge{background:var(--accent);color:#fff;font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:600}
          .subj-item{
            display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
            background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px
          }
          .subj-item .sname{font-weight:600;font-size:.88rem}
          .subj-item .hw{font-size:.82rem;color:var(--muted);margin-top:3px}
          .subj-item .hw.empty{color:var(--muted);opacity:.6}
          .subj-item .hw.done{color:var(--accent)}
          .empty-note{color:var(--muted);font-size:.85rem;text-align:center;padding:20px 0}
          .done-check{cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:transform .08s ease;-webkit-tap-highlight-color:transparent}
          .done-check:active{transform:scale(1.3)}
          [onclick]{-webkit-tap-highlight-color:transparent}
          span[onclick]{transition:transform .08s ease,opacity .08s ease;display:inline-block}
          span[onclick]:active{transform:scale(1.25);opacity:.6}
          .mode-row{display:flex;gap:6px;margin-bottom:6px}
          .mode-row select{margin-bottom:0}
          .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
          .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:340px;width:100%}
          .modal p{margin:0 0 16px;font-size:.9rem;line-height:1.6}
          .modal .row{display:flex;gap:8px}
          .modal .row button{flex:1}
          .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:60;max-width:85%;text-align:center}
          </style>
          </head>
          <body>
          <div class="wrap">
            <h1>📚 برنامه‌ی درسی من</h1>
            <p class="sub">برنامه هفتگی درس‌ها رو بچین، بعد تکالیف رو اضافه کن تا خودش سر جاشون بشینن.</p>

            <div class="tabs">
              <div class="tab active" data-tab="week">هفته</div>
              <div class="tab" data-tab="add">تکلیف جدید</div>
              <div class="tab" data-tab="schedule">برنامه درسی</div>
              <div class="tab" data-tab="exams">امتحانات</div>
              <div class="tab" data-tab="notes">یادداشت‌ها</div>
            </div>

            <div id="view-week"></div>

            <div id="view-add" style="display:none">
              <div class="card">
                <h2>ثبت تکلیف جدید</h2>
                <label>درس</label>
                <select id="hwSubject"></select>
                <label>متن تکلیف</label>
                <textarea id="hwText" placeholder="مثلاً: حل تمرین‌های صفحه ۴۵"></textarea>
                <button class="btn-primary" onclick="addHomework()">ثبت و جای‌گذاری خودکار</button>
              </div>
            </div>

            <div id="view-schedule" style="display:none">
              <div class="card">
                <h2>برنامه هفتگی</h2>
                <div id="scheduleEditor"></div>
              </div>
            </div>

            <div id="view-exams" style="display:none">
              <div class="card">
                <h2>امتحان / پرسش شفاهی جدید</h2>
                <label>نوع</label>
                <select id="examKind">
                  <option value="exam">امتحان</option>
                  <option value="oral">پرسش شفاهی</option>
                </select>
                <label>درس</label>
                <input type="text" id="examSubject" placeholder="مثلاً: ریاضی">
                <label>تاریخ امتحان</label>
                <div class="date-row">
                  <input type="number" id="examDay" placeholder="روز (مثلا ۱۶)" min="1" max="31" inputmode="numeric">
                  <input type="number" id="examMonth" placeholder="ماه (مثلا ۰۹)" min="1" max="12" inputmode="numeric">
                  <input type="number" id="examYear" placeholder="سال (مثلا ۱۴۰۴)" min="1400" max="1450" inputmode="numeric">
                </div>
                <button class="btn-primary" onclick="addExam()">ثبت امتحان</button>
              </div>
              <div id="examList"></div>
            </div>

            <div id="view-notes" style="display:none"></div>
          </div>

          <script>
          // ---- ساده‌ترین جایگزین برای confirm()/alert() که همیشه کار می‌کنه ----
          function showConfirm(message, onYes){
            const ov = document.createElement('div');
            ov.className = 'overlay';
            ov.innerHTML = `<div class="modal"><p>${escapeHtml(message)}</p>
              <div class="row">
                <button class="btn-ghost" id="confirmNo">خیر</button>
                <button class="btn-primary" id="confirmYes">بله</button>
              </div></div>`;
            document.body.appendChild(ov);
            ov.querySelector('#confirmNo').onclick = ()=> ov.remove();
            ov.querySelector('#confirmYes').onclick = ()=>{ ov.remove(); onYes(); };
          }
          function showToast(message){
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = message;
            document.body.appendChild(t);
            setTimeout(()=> t.remove(), 2400);
          }

          // ---- ارتباط با نوتیف اندروید ----
          function tomorrowDueList(){
            const tomorrow = addDays(new Date(), 1);
            const day = DAYS[persianDayIndex(tomorrow)];
            const parity = parityOf(tomorrow);
            const list = [];
            (schedule[day]||[]).forEach(entry=>{
              const subject = typeof entry==='string' ? entry : (parity===0 ? entry.alt[0] : entry.alt[1]);
              const hw = homeworks.find(h=> h.day===day && h.subject===subject && !h.done);
              if(hw) list.push({ id: hw.id, subject: subject, text: hw.text });
            });
            return list;
          }
          function syncNativeNotifications(){
            if(!window.AndroidBridge) return;
            try{ AndroidBridge.scheduleExamAlarms(JSON.stringify(exams)); }catch(e){}
            try{ AndroidBridge.syncTomorrowHomework(JSON.stringify(tomorrowDueList())); }catch(e){}
          }
          function applyPendingDoneFromNative(){
            if(!window.AndroidBridge) return;
            try{
              const idsJson = AndroidBridge.getPendingDoneIds();
              const ids = JSON.parse(idsJson || '[]');
              if(ids.length===0) return;
              let changed = false;
              homeworks.forEach(h=>{ if(ids.includes(h.id) && !h.done){ h.done = true; changed = true; } });
              if(changed){ saveAll(); renderWeek(); showToast('تکالیف دیروز به‌عنوان انجام‌شده علامت خورد ✅'); }
            }catch(e){}
          }
          if(window.AndroidBridge){
            try{ AndroidBridge.requestPermissions(); }catch(e){}
          }

          const DAYS = ["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
          // JS getDay(): 0=Sun..6=Sat -> map to our index (0=Sat)
          function persianDayIndex(date){ const g=date.getDay(); return (g+1)%7; }
          function todayIndex(){ return persianDayIndex(new Date()); }

          // این هفته (هفته‌ای که این صفحه ساخته شد) به عنوان هفته زوج (پاریتی ۰) در نظر گرفته شده:
          // یکشنبه‌اش = پژوهش ، سه‌شنبه‌اش = تربیت بدنی
          const REFERENCE_DATE = new Date(2026,8,27); // ۲۷ شهریور... یعنی تاریخ ساخت صفحه
          function saturdayOfWeek(date){ const d=new Date(date); d.setHours(0,0,0,0); d.setDate(d.getDate()-persianDayIndex(d)); return d; }
          function weeksSince(date){ const ref=saturdayOfWeek(REFERENCE_DATE), tgt=saturdayOfWeek(date); return Math.round((tgt-ref)/(7*86400000)); }
          function parityOf(date){ return ((weeksSince(date)%2)+2)%2; }
          function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }

          // هر آیتم برنامه یا یک رشته ساده‌ست، یا آبجکت {alt:[گزینه‌هفته‌زوج, گزینه‌هفته‌فرد]}
          const DEFAULT_SCHEDULE = {
            "شنبه": [],
            "یکشنبه": [],
            "دوشنبه": [],
            "سه‌شنبه": [],
            "چهارشنبه": [],
            "پنجشنبه": [],
            "جمعه": []
          };

          let schedule = load('schedule', null);
          if(!schedule || DAYS.every(d=> !schedule[d] || schedule[d].length===0)){
            schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
          }
          DAYS.forEach(d=>{ if(!schedule[d]) schedule[d]=[]; });

          let homeworks = load('homeworks', []); // {id, subject, text, day, createdAt, done}
          let notes = load('notes', {}); // {subject: noteText}
          let noteLocks = load('noteLocks', {}); // {subject: true/false}
          let exams = load('exams', []); // {id, subject, date}

          // ادغام درس‌های تکراری (مثلاً "ریاضی" و "ریاضیات" که یکی بودن)
          function mergeSubjectName(oldName, newName){
            let changed = false;
            DAYS.forEach(d=>{
              schedule[d] = schedule[d].map(e=>{
                if(typeof e==='string'){
                  if(e===oldName){ changed=true; return newName; }
                  return e;
                }
                e.alt = e.alt.map(o=>{ if(o===oldName){ changed=true; return newName; } return o; });
                return e;
              });
            });
            homeworks.forEach(h=>{ if(h.subject===oldName){ h.subject=newName; changed=true; } });
            if(notes[oldName]!==undefined){
              notes[newName] = notes[newName] ? (notes[newName] + '\n' + notes[oldName]) : notes[oldName];
              delete notes[oldName];
              changed = true;
            }
            if(noteLocks[oldName]!==undefined){
              noteLocks[newName] = noteLocks[newName] || noteLocks[oldName];
              delete noteLocks[oldName];
            }
            return changed;
          }
          if(mergeSubjectName('ریاضیات','ریاضی')) saveAll();

          function resolveDay(dayName, parity){
            return schedule[dayName].map(e=> typeof e==='string' ? e : (parity===0? e.alt[0] : e.alt[1]));
          }
          function dayHasSubjectOption(dayName, subject){
            return schedule[dayName].some(e=> typeof e==='string' ? e===subject : (e.alt[0]===subject || e.alt[1]===subject));
          }
          function entryLabel(e){
            return typeof e==='string' ? e : `${e.alt[0]} / ${e.alt[1]} (متناوب)`;
          }

          function load(key, fallback){
            try{ const v = localStorage.getItem('hwapp2_'+key); return v ? JSON.parse(v) : fallback; }
            catch(e){ return fallback; }
          }
          function save(key, val){
            try{ localStorage.setItem('hwapp2_'+key, JSON.stringify(val)); }catch(e){}
          }
          function saveAll(){ save('schedule', schedule); save('homeworks', homeworks); save('notes', notes); save('noteLocks', noteLocks); save('exams', exams); syncNativeNotifications(); }

          // ---- Tabs ----
          document.querySelectorAll('.tab').forEach(t=>{
            t.addEventListener('click', ()=>{
              document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
              t.classList.add('active');
              ['week','add','schedule','exams','notes'].forEach(v=>{
                const view = document.getElementById('view-'+v);
                const show = (v===t.dataset.tab);
                view.style.display = show ? 'block' : 'none';
                if(show){ view.classList.remove('view-fade'); void view.offsetWidth; view.classList.add('view-fade'); }
              });
              if(t.dataset.tab==='add') renderSubjectSelect();
              if(t.dataset.tab==='notes') renderNotes();
              if(t.dataset.tab==='exams') renderExams();
            });
          });

          // ---- تبدیل تاریخ شمسی/میلادی ----
          function jdiv(a,b){ return ~~(a/b); }
          function jmod(a,b){ return a - ~~(a/b)*b; }
          function jalCal(jy){
            const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
            const bl=breaks.length, gy=jy+621;
            let leapJ=-14, jp=breaks[0], jm, jump, leap, n, i;
            for(i=1;i<bl;i+=1){
              jm=breaks[i]; jump=jm-jp;
              if(jy<jm) break;
              leapJ = leapJ + jdiv(jump,33)*8 + jdiv(jmod(jump,33),4);
              jp=jm;
            }
            n = jy - jp;
            leapJ = leapJ + jdiv(n,33)*8 + jdiv(jmod(n,33)+3,4);
            if(jmod(jump,33)===4 && jump-n===4) leapJ += 1;
            const leapG = jdiv(gy,4) - jdiv((jdiv(gy,100)+1)*3,4) - 150;
            const march = 20 + leapJ - leapG;
            if(jump-n<6) n = n - jump + jdiv(jump+4,33)*33;
            leap = jmod(jmod(n+1,33)-1,4);
            if(leap===-1) leap=4;
            return { leap, gy, march };
          }
          function g2d(gy,gm,gd){
            let d = jdiv((gy+jdiv(gm-8,6)+100100)*1461,4) + jdiv(153*jmod(gm+9,12)+2,5) + gd - 34840408;
            d = d - jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4) + 752;
            return d;
          }
          function d2g(jdn){
            let j = 4*jdn + 139361631;
            j = j + jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4 - 3908;
            const i = jdiv(jmod(j,1461),4)*5 + 308;
            const gd = jdiv(jmod(i,153),5) + 1;
            const gm = jmod(jdiv(i,153),12) + 1;
            const gy = jdiv(j,1461) - 100100 + jdiv(8-gm,6);
            return { gy, gm, gd };
          }
          function j2d(jy,jm,jd){
            const r = jalCal(jy);
            return g2d(r.gy,3,r.march) + (jm-1)*31 - jdiv(jm,7)*(jm-7) + jd - 1;
          }
          function d2j(jdn){
            const gy = d2g(jdn).gy;
            let jy = gy - 621;
            const r = jalCal(jy);
            const jdn1f = g2d(gy,3,r.march);
            let jd, jm, k;
            k = jdn - jdn1f;
            if(k>=0){
              if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return {jy,jm,jd}; }
              k -= 186;
            } else {
              jy -= 1; k += 179;
              if(r.leap===1) k += 1;
            }
            jm = 7 + jdiv(k,30);
            jd = jmod(k,30) + 1;
            return { jy, jm, jd };
          }
          function jalaliToGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
          function gregorianToJalali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
          const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
          function isoToJalaliText(iso){
            const [gy,gm,gd] = iso.split('-').map(Number);
            const j = gregorianToJalali(gy,gm,gd);
            return `${j.jd} ${JALALI_MONTHS[j.jm-1]} ${j.jy}`;
          }

          // ---- امتحان‌ها ----
          function daysUntil(dateStr){
            const today = new Date(); today.setHours(0,0,0,0);
            const d = new Date(dateStr+'T00:00:00');
            return Math.round((d - today) / 86400000);
          }
          function addExam(){
            const kind = document.getElementById('examKind').value;
            const subj = document.getElementById('examSubject').value.trim();
            const day = parseInt(document.getElementById('examDay').value, 10);
            const month = parseInt(document.getElementById('examMonth').value, 10);
            const year = parseInt(document.getElementById('examYear').value, 10);
            if(!subj){ showToast('نام درس امتحان رو بنویس.'); return; }
            if(!day || !month || !year){ showToast('روز، ماه و سال امتحان رو کامل بنویس.'); return; }
            if(day<1 || day>31 || month<1 || month>12){ showToast('روز یا ماه درست نیست.'); return; }
            let g;
            try{ g = jalaliToGregorian(year, month, day); }
            catch(e){ showToast('این تاریخ معتبر نیست.'); return; }
            const pad = n => String(n).padStart(2,'0');
            const date = `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`;
            exams.push({ id: Date.now()+''+Math.floor(Math.random()*1000), subject: subj, date: date, kind: kind });
            exams.sort((a,b)=> a.date.localeCompare(b.date));
            document.getElementById('examSubject').value='';
            document.getElementById('examDay').value='';
            document.getElementById('examMonth').value='';
            document.getElementById('examYear').value='';
            saveAll();
            renderExams();
          }
          function removeExam(id){
            showConfirm('مطمئنی می‌خوای این امتحان رو پاک کنی؟', ()=>{
              exams = exams.filter(e=> e.id!==id);
              saveAll();
              renderExams();
            });
          }
          function renderExams(){
            const el = document.getElementById('examList');
            if(exams.length===0){ el.innerHTML = '<p class="sub" style="padding:4px 2px">هنوز امتحانی ثبت نکردی.</p>'; return; }
            el.innerHTML = exams.map(e=>{
              const label = e.kind==='oral' ? 'پرسش شفاهی' : 'امتحان';
              const left = daysUntil(e.date);
              let statusText, statusColor;
              if(left < 0){ statusText='گذشته'; statusColor='var(--muted)'; }
              else if(left === 0){ statusText=`امروز ${label}ه! موفق باشی 🌿`; statusColor='var(--accent)'; }
              else if(left === 1){ statusText=`فردا ${label} داری`; statusColor='var(--accent)'; }
              else { statusText=`${left} روز مونده`; statusColor='var(--muted)'; }
              return `<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px">
                <div>
                  <div style="font-weight:600">${escapeHtml(e.subject)} <span class="sub" style="font-weight:400">· ${label}</span></div>
                  <div class="sub" style="margin:4px 0 0">${isoToJalaliText(e.date)} · <span style="color:${statusColor}">${statusText}</span></div>
                </div>
                <span onclick="removeExam('${e.id}')" style="cursor:pointer;font-size:1.2rem;color:var(--muted);flex-shrink:0">×</span>
              </div>`;
            }).join('');
          }

          function renderScheduleEditor(){
            const el = document.getElementById('scheduleEditor');
            el.innerHTML = '';
            DAYS.forEach(day=>{
              const block = document.createElement('div');
              block.className='day-row';
              const chipsHtml = schedule[day].map((e,i)=>
                `<div class="chip">${escapeHtml(entryLabel(e))}<span onclick="removeSubject('${day}',${i})">×</span></div>`
              ).join('');
              block.innerHTML = `
                <div class="name">${day}</div>
                <div class="chips">${chipsHtml}</div>
              `;
              el.appendChild(block);

              const inputRow = document.createElement('div');
              inputRow.className='day-input';
              inputRow.style.marginRight='86px';
              inputRow.style.marginBottom='14px';
              inputRow.innerHTML = `
                <select id="mode-${day}" onchange="document.getElementById('inp2-${day}').style.display = this.value==='alt' ? 'block' : 'none'">
                  <option value="normal">عادی</option>
                  <option value="alt">متناوب (هفته درمیان)</option>
                </select>
                <input type="text" placeholder="نام درس" id="inp-${day}">
                <input type="text" placeholder="نام درس (هفته دوم)" id="inp2-${day}" style="display:none">
                <button class="btn-ghost" onclick="addSubject('${day}')">افزودن</button>
              `;
              el.appendChild(inputRow);
            });
          }
          function addSubject(day){
            const mode = document.getElementById('mode-'+day).value;
            const inp = document.getElementById('inp-'+day);
            const val = inp.value.trim();
            if(!val) return;
            if(mode==='alt'){
              const inp2 = document.getElementById('inp2-'+day);
              const val2 = inp2.value.trim();
              if(!val2){ showToast('نام درس هفته دوم رو هم بنویس.'); return; }
              schedule[day].push({alt:[val, val2]});
              inp2.value='';
            } else {
              schedule[day].push(val);
            }
            inp.value='';
            saveAll();
            renderScheduleEditor();
            renderSubjectSelect();
            renderWeek();
          }
          function removeSubject(day, idx){
            const entry = schedule[day][idx];
            const label = typeof entry==='string' ? entry : entry.alt.join(' / ');
            showConfirm(`مطمئنی می‌خوای «${label}» رو از ${day} پاک کنی؟`, ()=>{
              schedule[day].splice(idx,1);
              saveAll();
              renderScheduleEditor();
              renderSubjectSelect();
              renderWeek();
            });
          }

          // ---- Add homework ----
          function allSubjects(){
            const set = new Set();
            DAYS.forEach(d=> schedule[d].forEach(e=>{
              if(typeof e==='string') set.add(e);
              else { set.add(e.alt[0]); set.add(e.alt[1]); }
            }));
            return [...set];
          }
          function renderSubjectSelect(){
            const sel = document.getElementById('hwSubject');
            const subs = allSubjects();
            sel.innerHTML = subs.length
              ? subs.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
              : `<option value="">ابتدا در «برنامه درسی» درس اضافه کن</option>`;
          }
          function nearestDayFor(subject){
            const now = new Date();
            const afterCutoff = (now.getHours() > 15) || (now.getHours()===15 && now.getMinutes()>=30);
            const startOffset = afterCutoff ? 1 : 0; // اگه بعد از ۳:۳۰ عصره، امروز دیگه حساب نمی‌شه
            for(let offset=startOffset; offset<startOffset+14; offset++){ // تا دو هفته جلو، برای درس‌های چرخشی
              const date = addDays(now, offset);
              const day = DAYS[persianDayIndex(date)];
              const parity = parityOf(date);
              const matches = schedule[day].some(e=>
                typeof e==='string' ? e===subject : (parity===0 ? e.alt[0] : e.alt[1])===subject
              );
              if(matches) return day;
            }
            return null;
          }
          function addHomework(){
            const subject = document.getElementById('hwSubject').value;
            const text = document.getElementById('hwText').value.trim();
            if(!subject){ showToast('اول یه درس به برنامه هفتگی اضافه کن.'); return; }
            if(!text){ showToast('متن تکلیف رو بنویس.'); return; }
            const day = nearestDayFor(subject);
            if(!day){ showToast('این درس توی برنامه هفتگی نیست.'); return; }
            homeworks.push({ id: Date.now()+''+Math.random(), subject, text, day, done:false, createdAt: Date.now() });
            saveAll();
            document.getElementById('hwText').value='';
            document.querySelector('.tab[data-tab="week"]').click();
            renderWeek();
          }
          function toggleDone(id){
            const h = homeworks.find(x=>x.id===id);
            if(h){ h.done = !h.done; saveAll(); renderWeek(); }
          }
          function deleteHw(id){
            homeworks = homeworks.filter(x=>x.id!==id);
            saveAll();
            renderWeek();
          }

          // ---- Week view ----
          function renderWeek(){
            const el = document.getElementById('view-week');
            const now = new Date();
            const t = persianDayIndex(now);
            const afterCutoff = (now.getHours() > 15) || (now.getHours()===15 && now.getMinutes()>=30);
            const startIdx = afterCutoff ? (t+1)%7 : t;
            const startLabel = afterCutoff ? 'فردا' : 'امروز';
            const parity = parityOf(now);

            let examBanner = '';
            const upcoming = exams.filter(e=>{ const d = daysUntil(e.date); return d>=0 && d<=5; })
                                   .sort((a,b)=> daysUntil(a.date)-daysUntil(b.date));
            if(upcoming.length){
              examBanner = '<div class="card" style="margin-bottom:14px;border-color:var(--accent)">' +
                upcoming.map(e=>{
                  const label = e.kind==='oral' ? 'پرسش شفاهی' : 'امتحان';
                  const d = daysUntil(e.date);
                  const txt = d===0 ? `امروز ${label} ${escapeHtml(e.subject)} داری! موفق باشی 🌿` : `${d} روز تا ${label} ${escapeHtml(e.subject)}`;
                  return `<div style="color:var(--accent);font-weight:600">${txt}</div>`;
                }).join('') + '</div>';
            }

            const visibleDays = DAYS.filter((day, idx) => idx >= startIdx && schedule[day].length>0);
            const hasPendingNextWeek = DAYS.some((day, idx)=>{
              if(idx >= startIdx) return false;
              let diff = (idx - t + 7) % 7;
              if(diff===0) diff = 7;
              const nextParity = parityOf(addDays(now, diff));
              return schedule[day].some(entry=>{
                if(typeof entry==='string') return homeworks.some(h=>h.day===day && h.subject===entry && !h.done);
                const expected = nextParity===0 ? entry.alt[0] : entry.alt[1];
                return homeworks.some(h=>h.day===day && h.subject===expected && !h.done);
              });
            });
            if(visibleDays.length===0 && !hasPendingNextWeek){
              const hasAny = DAYS.some(d=>schedule[d].length>0);
              el.innerHTML = examBanner + (hasAny
                ? `<div class="card"><p class="empty-note">برای این هفته روز دیگه‌ای باقی نمونده. آخر هفته خوبی داشته باشی 🌿</p></div>`
                : `<div class="card"><p class="empty-note">هنوز برنامه درسی وارد نکردی. برو تب «برنامه درسی».</p></div>`);
              return;
            }
            let html='';
            DAYS.forEach((day, idx)=>{
              if(idx < startIdx) return;
              if(schedule[day].length===0) return;
              const badge = idx===startIdx ? `<span class="today-badge">${startLabel}</span>` : '';
              html += `<div class="day-block"><div class="day-title">${day} ${badge}</div>`;
              schedule[day].forEach(entry=>{
                let subject;
                if(typeof entry==='string'){
                  subject = entry;
                } else {
                  const [optA, optB] = entry.alt;
                  const hwA = homeworks.find(h=>h.day===day && h.subject===optA && !h.done);
                  const hwB = homeworks.find(h=>h.day===day && h.subject===optB && !h.done);
                  subject = hwA ? optA : hwB ? optB : (parity===0 ? optA : optB);
                }
                html += subjItemHtml(day, subject);
              });
              html += `</div>`;
            });

            // روزهایی که توی همین هفته دیگه دیده نمی‌شن، ولی براشون از قبل تکلیفی برای هفتهٔ بعد ثبت شده
            let nextWeekHtml='';
            DAYS.forEach((day, idx)=>{
              if(idx >= startIdx) return;
              if(schedule[day].length===0) return;
              // تاریخ نزدیک‌ترین وقوع بعدی این روز از هفته (همیشه هفتهٔ بعد، چون امسال هفته گذشته)
              let diff = (idx - t + 7) % 7;
              if(diff===0) diff = 7;
              const nextDate = addDays(now, diff);
              const nextParity = parityOf(nextDate);

              const pendingSubjects = [];
              schedule[day].forEach(entry=>{
                if(typeof entry==='string'){
                  if(homeworks.some(h=>h.day===day && h.subject===entry && !h.done)) pendingSubjects.push(entry);
                } else {
                  const expected = nextParity===0 ? entry.alt[0] : entry.alt[1];
                  if(homeworks.some(h=>h.day===day && h.subject===expected && !h.done)) pendingSubjects.push(expected);
                }
              });
              if(pendingSubjects.length===0) return;
              nextWeekHtml += `<div class="day-block"><div class="day-title">${day} <span class="today-badge" style="background:var(--muted)">هفته بعد</span></div>`;
              pendingSubjects.forEach(subject=>{ nextWeekHtml += subjItemHtml(day, subject); });
              nextWeekHtml += `</div>`;
            });
            if(nextWeekHtml) html += nextWeekHtml;

            el.innerHTML = examBanner + html;
          }

          function subjItemHtml(day, subject){
            const hw = homeworks.filter(h=>h.day===day && h.subject===subject && !h.done)
                                 .sort((a,b)=>b.createdAt-a.createdAt)[0];
            return `<div class="subj-item">
              <div>
                <div class="sname">${escapeHtml(subject)}</div>
                <div class="hw ${hw?'':'empty'}">${hw ? escapeHtml(hw.text) : '-'}</div>
              </div>
              ${hw ? `
                <div style="display:flex;gap:6px;align-items:center">
                  <span class="done-check" title="انجام شد" onclick="toggleDone('${hw.id}')">✅</span>
                  <button class="btn-danger" onclick="deleteHw('${hw.id}')">حذف</button>
                </div>` : ''}
            </div>`;
          }

          function escapeHtml(s){
            return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          }

          function renderNotes(){
            const el = document.getElementById('view-notes');
            const subs = allSubjects();
            if(subs.length===0){
              el.innerHTML = `<div class="card"><p class="empty-note">اول یه درس به برنامه هفتگی اضافه کن.</p></div>`;
              return;
            }
            el.innerHTML = subs.map(s=>{
              const locked = !!noteLocks[s];
              return `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <h2 style="margin:0">${escapeHtml(s)}</h2>
                  <span class="lock-toggle" data-subject="${escapeHtml(s)}" onclick="toggleLock(this)" style="cursor:pointer;font-size:1.15rem" title="${locked?'قفل است - برای باز کردن بزن':'برای قفل کردن بزن'}">${locked?'🔒':'🔓'}</span>
                </div>
                <textarea style="min-height:90px" data-subject="${escapeHtml(s)}" oninput="saveNote(this)" ${locked?'readonly':''} placeholder="یادداشت برای ${escapeHtml(s)}...">${escapeHtml(notes[s]||'')}</textarea>
              </div>`;
            }).join('');
          }
          function toggleLock(el){
            const subject = el.dataset.subject;
            noteLocks[subject] = !noteLocks[subject];
            saveAll();
            renderNotes();
          }
          function saveNote(el){
            if(noteLocks[el.dataset.subject]) return;
            notes[el.dataset.subject] = el.value;
            saveAll();
          }

          renderScheduleEditor();
          renderSubjectSelect();
          renderWeek();
          applyPendingDoneFromNative();
          syncNativeNotifications();
          </script>
          </body>
          </html>
          PROJFILEEOF
          base64 -d icon_b64.txt > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SampadAPK
          path: app/build/outputs/apk/debug/*.apk
