          <meta name="apple-mobile-web-app-title" content="درسی من">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="theme-color" content="#0c0f0d">
          <style>
          :root{
            --bg:#0c0f0d; --card:#141917; --ink:#eaf2ec; --muted:#8aa196;
            --accent:#34d399; --accent-soft:#132821; --line:#223029; --danger:#e08a7c;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top,0px);
            padding-bottom:env(safe-area-inset-bottom,0px);
          }
          *{box-sizing:border-box}
          html,body{height:100%}
          body{
            margin:0; background:var(--bg); color:var(--ink);
            font-family:'Vazirmatn','Tahoma',sans-serif;
            -webkit-font-smoothing:antialiased;
          }
          .wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
          h1{font-size:1.3rem;margin:6px 0 2px}
          .sub{color:var(--muted);font-size:.85rem;margin:0 0 18px}
          .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
          .tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;cursor:pointer;font-size:.88rem;color:var(--muted);user-select:none;
            transition:background .2s ease, color .2s ease, transform .08s ease;-webkit-tap-highlight-color:transparent}
          .tab:active{transform:scale(.95)}
          .tab.active{background:var(--accent);color:#06130d;font-weight:600}
          .view-fade{animation:viewFadeIn .22s ease}
          @keyframes viewFadeIn{
