          package com.sampad.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);

                  webView.addJavascriptInterface(new NotifyBridge(this), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton("باشه", (d, w) -> result.confirm())
                                  .setCancelable(false)
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton("بله", (d, w) -> result.confirm())
                                  .setNegativeButton("خیر", (d, w) -> result.cancel())
                                  .setCancelable(false)
                                  .show();
                          return true;
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.evaluateJavascript("if(window.applyPendingDoneFromNative) applyPendingDoneFromNative();", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          PROJFILEEOF
          cat > app/src/main/java/com/sampad/app/Notif.java << 'PROJFILEEOF'
          package com.sampad.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.text.ParseException;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Locale;

          public class Notif {
              static final String CHANNEL_ID = "sampad_reminders";
              static final String PREFS = "sampad_notif_prefs";
              static final int DAILY_HW_REQUEST_CODE = 90001;
              static final int DAILY_HW_NOTIF_ID = 90001;

              static SharedPreferences prefs(Context ctx) {
                  return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              static void ensureChannel(Context ctx) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      NotificationChannel ch = nm.getNotificationChannel(CHANNEL_ID);
                      if (ch == null) {
                          ch = new NotificationChannel(CHANNEL_ID, "یادآوری برنامه درسی", NotificationManager.IMPORTANCE_HIGH);
                          ch.setDescription("یادآوری امتحان‌ها و تکالیف");
                          nm.createNotificationChannel(ch);
                      }
                  }
              }

              static int piFlags() {
                  return PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
              }

              static void showExamNotification(Context ctx, int notifId, String title, String text) {
                  ensureChannel(ctx);
                  Notification.Builder b = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          ? new Notification.Builder(ctx, CHANNEL_ID)
                          : new Notification.Builder(ctx);
                  b.setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setAutoCancel(true)
                          .setPriority(Notification.PRIORITY_HIGH);

                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openPi = PendingIntent.getActivity(ctx, notifId, openIntent, piFlags());
                  b.setContentIntent(openPi);

                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(notifId, b.build());
              }

              static void showDailyHwNotification(Context ctx) {
                  SharedPreferences p = prefs(ctx);
                  String json = p.getString("tomorrow_hw_json", "[]");
                  try {
                      JSONArray arr = new JSONArray(json);
                      if (arr.length() == 0) return;
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          if (i > 0) sb.append("، ");
                          sb.append(o.optString("subject"));
                      }
                      String bodyText = "فردا باید این درسا رو انجام بدی: " + sb;

                      ensureChannel(ctx);
                      Notification.Builder b = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                              ? new Notification.Builder(ctx, CHANNEL_ID)
                              : new Notification.Builder(ctx);
                      b.setSmallIcon(android.R.drawable.ic_dialog_info)
                              .setContentTitle("تکالیف فردا")
                              .setContentText(bodyText)
                              .setStyle(new Notification.BigTextStyle().bigText(bodyText))
                              .setAutoCancel(true)
                              .setPriority(Notification.PRIORITY_HIGH);

                      Intent openIntent = new Intent(ctx, MainActivity.class);
                      openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent openPi = PendingIntent.getActivity(ctx, DAILY_HW_NOTIF_ID, openIntent, piFlags());
                      b.setContentIntent(openPi);

                      Intent doneIntent = new Intent(ctx, DoneActionReceiver.class);
                      PendingIntent donePi = PendingIntent.getBroadcast(ctx, DAILY_HW_NOTIF_ID, doneIntent, piFlags());
                      b.addAction(android.R.drawable.checkbox_on_background, "بله حل کرده‌ام", donePi);

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify(DAILY_HW_NOTIF_ID, b.build());
                  } catch (Exception ignored) {
                  }
              }

              static void scheduleAlarm(Context ctx, int requestCode, Calendar when, Intent intent) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, requestCode, intent, piFlags());
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when.getTimeInMillis(), pi);
                  } catch (SecurityException se) {
                      try {
                          am.set(AlarmManager.RTC_WAKEUP, when.getTimeInMillis(), pi);
                      } catch (Exception ignored) {
                      }
                  }
              }

              static void cancelAlarm(Context ctx, int requestCode) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  Intent it = new Intent(ctx, AlarmReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, requestCode, it, piFlags());
                  am.cancel(pi);
              }

              // ---- امتحان‌ها ----
              static void scheduleExamAlarms(Context ctx, String examsJson) {
                  SharedPreferences p = prefs(ctx);

                  try {
                      JSONArray oldCodes = new JSONArray(p.getString("scheduled_exam_codes", "[]"));
                      for (int i = 0; i < oldCodes.length(); i++) {
                          cancelAlarm(ctx, oldCodes.getInt(i));
                      }
                  } catch (Exception ignored) {
                  }

                  ArrayList<Integer> newCodes = new ArrayList<>();
                  SimpleDateFormat fmt = new SimpleDateFormat("yyyy-MM-dd", Locale.US);
                  Calendar now = Calendar.getInstance();

                  try {
                      JSONArray exams = new JSONArray(examsJson);
                      for (int i = 0; i < exams.length(); i++) {
                          JSONObject ex = exams.getJSONObject(i);
                          String id = ex.optString("id");
                          String subject = ex.optString("subject");
                          String dateStr = ex.optString("date");
                          String kind = ex.optString("kind", "exam");
                          if (id.isEmpty() || dateStr.isEmpty()) continue;

                          Calendar examDay;
                          try {
                              java.util.Date d = fmt.parse(dateStr);
                              examDay = Calendar.getInstance();
                              examDay.setTime(d);
                          } catch (ParseException pe) {
                              continue;
                          }

                          int base = (id.hashCode() & 0xFFFFFF) * 10;

                          int[] daysBefore = {5, 4, 3};
                          for (int k = 0; k < daysBefore.length; k++) {
                              Calendar remind = (Calendar) examDay.clone();
                              remind.add(Calendar.DAY_OF_YEAR, -daysBefore[k]);
                              remind.set(Calendar.HOUR_OF_DAY, 17);
                              remind.set(Calendar.MINUTE, 0);
                              remind.set(Calendar.SECOND, 0);
                              remind.set(Calendar.MILLISECOND, 0);
                              if (remind.after(now)) {
                                  int code = base + k;
                                  Intent it = new Intent(ctx, AlarmReceiver.class);
                                  it.putExtra("type", "exam_reminder");
                                  it.putExtra("subject", subject);
                                  it.putExtra("kind", kind);
                                  it.putExtra("daysLeft", daysBefore[k]);
                                  it.putExtra("notifId", code);
                                  scheduleAlarm(ctx, code, remind, it);
                                  newCodes.add(code);
                              }
                          }

                          Calendar examMorning = (Calendar) examDay.clone();
                          examMorning.set(Calendar.HOUR_OF_DAY, 7);
                          examMorning.set(Calendar.MINUTE, 0);
                          examMorning.set(Calendar.SECOND, 0);
                          examMorning.set(Calendar.MILLISECOND, 0);
                          if (examMorning.after(now)) {
                              int code = base + 9;
                              Intent it = new Intent(ctx, AlarmReceiver.class);
                              it.putExtra("type", "exam_day");
                              it.putExtra("subject", subject);
                              it.putExtra("kind", kind);
                              it.putExtra("notifId", code);
                              scheduleAlarm(ctx, code, examMorning, it);
                              newCodes.add(code);
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  JSONArray codesArr = new JSONArray(newCodes);
                  p.edit()
                          .putString("exams_json", examsJson)
                          .putString("scheduled_exam_codes", codesArr.toString())
                          .apply();
              }

              // ---- تکالیف فردا ----
              static void syncTomorrowHomework(Context ctx, String hwJson) {
                  prefs(ctx).edit().putString("tomorrow_hw_json", hwJson).apply();
                  ensureDailyAlarm(ctx);
              }

              static void ensureDailyAlarm(Context ctx) {
                  Calendar next = Calendar.getInstance();
                  next.set(Calendar.HOUR_OF_DAY, 20);
                  next.set(Calendar.MINUTE, 0);
                  next.set(Calendar.SECOND, 0);
                  next.set(Calendar.MILLISECOND, 0);
                  if (!next.after(Calendar.getInstance())) {
                      next.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  Intent it = new Intent(ctx, AlarmReceiver.class);
                  it.putExtra("type", "daily_hw");
                  scheduleAlarm(ctx, DAILY_HW_REQUEST_CODE, next, it);
              }

              static void rescheduleAllAfterBoot(Context ctx) {
                  SharedPreferences p = prefs(ctx);
                  String exams = p.getString("exams_json", null);
                  if (exams != null) scheduleExamAlarms(ctx, exams);
                  ensureDailyAlarm(ctx);
              }
          }
          PROJFILEEOF
          cat > app/src/main/java/com/sampad/app/AlarmReceiver.java << 'PROJFILEEOF'
          package com.sampad.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String type = intent.getStringExtra("type");
                  if (type == null) return;

                  if ("exam_reminder".equals(type)) {
                      String subject = intent.getStringExtra("subject");
                      String kind = intent.getStringExtra("kind");
                      boolean oral = "oral".equals(kind);
                      String label = oral ? "پرسش شفاهی" : "امتحان";
                      int daysLeft = intent.getIntExtra("daysLeft", 0);
                      int notifId = intent.getIntExtra("notifId", (int) System.currentTimeMillis());
                      String text = daysLeft + " روز تا " + label + " " + subject;
                      Notif.showExamNotification(context, notifId, "یادآوری " + label, text);
                  } else if ("exam_day".equals(type)) {
                      String subject = intent.getStringExtra("subject");
                      String kind = intent.getStringExtra("kind");
                      boolean oral = "oral".equals(kind);
                      String label = oral ? "پرسش شفاهی" : "امتحان";
                      int notifId = intent.getIntExtra("notifId", (int) System.currentTimeMillis());
                      Notif.showExamNotification(context, notifId, "امروز " + label + " " + subject + " داری", "آرزوی موفقیت 🌿");
                  } else if ("daily_hw".equals(type)) {
                      Notif.showDailyHwNotification(context);
                      // زنگ فردا رو هم از همین‌جا تنظیم کن تا هر روز خودش تکرار بشه
                      Notif.ensureDailyAlarm(context);
                  }
              }
          }
          PROJFILEEOF
          cat > app/src/main/java/com/sampad/app/DoneActionReceiver.java << 'PROJFILEEOF'
          package com.sampad.app;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class DoneActionReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  SharedPreferences p = Notif.prefs(context);
                  String hwJson = p.getString("tomorrow_hw_json", "[]");
                  try {
                      JSONArray hw = new JSONArray(hwJson);
                      JSONArray ids = new JSONArray();
                      for (int i = 0; i < hw.length(); i++) {
                          JSONObject o = hw.getJSONObject(i);
                          ids.put(o.optString("id"));
                      }
                      // با هر آیدی جدید، به لیست منتظرها اضافه می‌کنیم (اگه از قبل چیزی مونده بود)
                      JSONArray pending = new JSONArray(p.getString("pending_done_ids", "[]"));
                      for (int i = 0; i < ids.length(); i++) pending.put(ids.get(i));
                      p.edit().putString("pending_done_ids", pending.toString()).apply();
                  } catch (Exception ignored) {
                  }

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.cancel(Notif.DAILY_HW_NOTIF_ID);
              }
          }
          PROJFILEEOF
          cat > app/src/main/java/com/sampad/app/BootReceiver.java << 'PROJFILEEOF'
          package com.sampad.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Notif.rescheduleAllAfterBoot(context);
                  }
              }
          }
          PROJFILEEOF
          cat > app/src/main/java/com/sampad/app/NotifyBridge.java << 'PROJFILEEOF'
          package com.sampad.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.webkit.JavascriptInterface;

          public class NotifyBridge {
              private final Activity activity;

              NotifyBridge(Activity activity) {
                  this.activity = activity;
              }

              @JavascriptInterface
              public void scheduleExamAlarms(String examsJson) {
                  Notif.scheduleExamAlarms(activity, examsJson);
              }

              @JavascriptInterface
              public void syncTomorrowHomework(String hwJson) {
                  Notif.syncTomorrowHomework(activity, hwJson);
              }

              @JavascriptInterface
              public String getPendingDoneIds() {
                  SharedPreferences p = Notif.prefs(activity);
                  String ids = p.getString("pending_done_ids", "[]");
                  p.edit().remove("pending_done_ids").apply();
                  return ids;
              }

              @JavascriptInterface
              public void requestPermissions() {
                  activity.runOnUiThread(() -> {
                      if (Build.VERSION.SDK_INT >= 33) {
                          if (activity.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                                  != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              activity.requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 1001);
                          }
                      }
                      if (Build.VERSION.SDK_INT >= 31) {
                          AlarmManager am = (AlarmManager) activity.getSystemService(Context.ALARM_SERVICE);
                          if (am != null && !am.canScheduleExactAlarms()) {
                              try {
                                  Intent it = new Intent(android.provider.Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                                  it.setData(Uri.parse("package:" + activity.getPackageName()));
                                  activity.startActivity(it);
                              } catch (Exception ignored) {
                              }
                          }
                      }
                  });
              }
          }
